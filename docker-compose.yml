services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.local
    volumes:
      - /code/node_modules
      - /code/.next
      - ./frontend:/code
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
  backend:
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    build:
      context: backend
      dockerfile: Dockerfile.local
    volumes:
      - ./backend:/code
    environment:
      # Django uploads over the compose network, but the URLs it hands out are fetched by
      # the browser, which can't resolve `storage`. Hence the two different hosts. In
      # production both point at R2 (endpoint) and its custom domain (public reads)
      - DJANGO_MEDIA_ENDPOINT_URL=http://storage:9000
      - DJANGO_MEDIA_CUSTOM_DOMAIN=localhost:9400/media
      # DJANGO_MEDIA_URL_PROTOCOL is deliberately absent - settings.py derives it from
      # PRODUCTION, so http: here and https: on a deploy both come for free
      - DJANGO_MEDIA_BUCKET=media
      - DJANGO_MEDIA_ACCESS_KEY=devaccesskey
      - DJANGO_MEDIA_SECRET_KEY=devsecretkey
    # The container's CMD runs migrate/collectstatic before serving, so "running" is
    # not the same as "ready". Without this, `compose up --wait` in CI can hand back
    # control while the backend is still migrating.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/config/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
  database:
    image: postgres:latest
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  cache:
    image: valkey/valkey:latest
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
  caddy:
    image: caddy:latest
    ports:
      - 3000:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
  # Stands in for Cloudflare R2, so development and production run the same S3 code path.
  # Note this is not a fidelity guarantee: SeaweedFS implements a subset of S3 and R2
  # implements a different subset, so the STORAGES options in settings.py deliberately stay
  # inside what both support. What this container buys is that media is served from a
  # separate origin over a real S3 client, so CORS, CSP and cache-header problems surface
  # here rather than at deploy
  storage:
    # SeaweedFS replaced MinIO here
    # Pinned on purpose, and one release behind: upstream tags weekly, so `latest` is a
    # moving target in a way postgres and valkey are not
    image: chrislusf/seaweedfs:4.46
    # `server` runs master, volume, filer and the S3 gateway in one process, which is all a
    # single-node development bucket needs. The S3 port is pinned to 9000 - the default is
    # 8333 - so the endpoint URL below and the published port keep their old shape
    command: >
      server -dir=/data -s3 -s3.port=9000
      -s3.config=/etc/seaweedfs/s3.json
      -ip.bind=0.0.0.0
    ports:
      # Published so the browser fetches media from a genuinely different origin to the
      # app, exactly as it will in production. Django itself uploads to `storage:9000`
      # over the compose network and never uses these
      - 9400:9000
      # The filer's file browser, which is what's left of MinIO's console: it lists objects
      # under /buckets/media for inspecting uploads by hand
      - 9401:8888
    volumes:
      # Deliberately not the old `storage-data` volume since that contains `minio` data
      # that SeaweedFS cannot read
      - seaweedfs-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Not the S3 port's /healthz: SeaweedFS parses that as a bucket name and 404s it
      # (seaweedfs#8243). The master's healthz covers the cluster, and any HTTP status line
      # off the S3 port proves the gateway is serving - an unauthenticated ListBuckets is a
      # legitimate 403, so this cannot ask wget for a 2xx. That the gateway can also reach
      # the filer is what `storage-init` proves, and backend waits on that too
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9333/cluster/healthz >/dev/null && wget -S -qO /dev/null http://localhost:9000/ 2>&1 | grep -q 'HTTP/1.1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  # Creates the bucket that `storage` then serves. Runs to completion and exits; `backend`
  # waits for that. Anonymous read comes from the `anonymous` identity in seaweedfs-s3.json
  # rather than a per-bucket policy, so unlike MinIO's `mc anonymous set download` there is
  # nothing to apply here afterwards
  storage-init:
    image: chrislusf/seaweedfs:4.46
    depends_on:
      storage:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        echo "s3.bucket.create -name media" | weed shell -master=storage:9333

volumes:
  seaweedfs-data:
