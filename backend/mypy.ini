[mypy]
check_untyped_defs = True
disallow_untyped_defs = True
warn_return_any = True
show_error_codes = True
warn_unused_ignores = True

# Matched with re.search against the path as mypy sees it, which depends on where mypy was
# invoked from: `manage.py` running in backend/, `backend/manage.py` from the repo root (which
# is what the dev container's editor integration does). `(^|/)` matches either, so these stay
# excluded regardless of cwd - a bare `^` anchor silently stops excluding anything.
exclude = (?x)(
    (^|/)manage\.py$               # Django-generated management script comes with no types
    | (^|/)gunicorn\.conf\.py$     # gunicorn config uses monkeypatching, which types poorly
  )
plugins =
    mypy_django_plugin.main,mypy_drf_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = "backend.settings"

# Stubs don't yet exist for these modules
[mypy-environ]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-django_apscheduler.*]
ignore_missing_imports = True

[mypy-django_dramatiq.*]
ignore_missing_imports = True

[mypy-sentry_sdk.*]
ignore_missing_imports = True
