[pytest]
DJANGO_SETTINGS_MODULE = backend.settings
addopts = -p no:warnings
# pytest's defaults are test_*.py and *_test.py, which silently skip the per-app tests.py
# that `startapp` generates - naming a file explicitly collects it, but a bare `pytest`
# run does not, so tests written there would never reach CI. `tests.py` is added so both
# layouts work
python_files = test_*.py *_test.py tests.py
